<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바꿔먹기 — 국가표준식품성분 DB</title>
<meta name="description" content="국가표준식품성분 DB 10.4의 식품 3,366점을 검색·비교하고, 성분 기준으로 대체 식품을 찾는 웹 도구입니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E7D4F'/%3E%3Cpath d='M9 20.5c0-4 3-6.5 7-6.5' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M13 10.5l3.5 3.5L13 17.5' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23 11.5c0 4-3 6.5-7 6.5' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' opacity='.55'/%3E%3Cpath d='M19 21.5L15.5 18 19 14.5' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='.55'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  color-scheme:light;
  --bg:#fff; --fg:#16181C; --sub:#606770; --line:#E6E8EC; --soft:#F6F6F4;
  --brand:#2E7D4F; --brand-w:#EAF3ED; --up:#1D6FD0; --down:#C8442E; --card:#fff;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--fg);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:50}
.hd{display:flex;align-items:center;gap:22px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.03em}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:block;flex:0 0 auto}
nav{display:flex;gap:4px;margin-left:auto}
nav a{padding:7px 13px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--sub)}
nav a[aria-current=page]{background:var(--brand-w);color:var(--brand)}

.hero{padding:56px 0 30px;text-align:center}
.hero h1{font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1.25}
.hero p{margin-top:14px;color:var(--sub);font-size:16px;letter-spacing:-.02em}
.searchbox{margin:30px auto 0;max-width:600px;position:relative}
.searchbox input{width:100%;padding:16px 18px;border:2px solid var(--line);border-radius:14px;
  background:var(--card);font-size:16.5px;outline:none}
.searchbox input:focus{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:22px}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;
  background:var(--card);cursor:pointer;font-weight:600;color:var(--sub)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

.sec{padding:26px 0 60px}
.cnt{font-size:13.5px;color:var(--sub);margin-bottom:12px}
.list{display:grid;gap:9px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--brand)}
.item .nm{font-weight:700;font-size:15.5px;letter-spacing:-.025em;flex:1;min-width:0}
.item .nm span{display:block;font-weight:500;font-size:12.5px;color:var(--sub);margin-top:2px}
.item .kv{text-align:right;font-size:12.5px;color:var(--sub);flex:0 0 auto;line-height:1.45}
.item .kv b{display:block;font-size:16px;color:var(--fg);font-weight:800}

.crumb{padding:22px 0 0;font-size:13.5px;color:var(--sub)}
.crumb button{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:0}
h2.tt{font-size:29px;font-weight:800;letter-spacing:-.04em;margin:10px 0 4px;line-height:1.3}
.meta{color:var(--sub);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px;align-items:center}
.btn{padding:9px 15px;border:1px solid var(--line);background:var(--card);border-radius:9px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.amt{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--sub)}
.amt input{width:78px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);text-align:right}

.grp{margin-top:26px}
.grp h3{font-size:15px;font-weight:800;letter-spacing:-.02em;padding-bottom:8px;
  border-bottom:2px solid var(--fg);margin-bottom:2px}
.nr{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;
  border-bottom:1px solid var(--line);font-size:14.5px}
.nr span{color:var(--sub)}
.nr b{font-weight:700;font-variant-numeric:tabular-nums}
.nr.zero b{color:var(--sub);font-weight:500}

.swapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 18px;
  padding:14px 16px;background:var(--soft);border-radius:12px}
.swapbar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.delta{font-weight:800;font-size:13.5px}
.delta.d{color:var(--down)}.delta.u{color:var(--up)}

table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:right;
  font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--sub)}
table.cmp thead th{font-size:13.5px;font-weight:800;border-bottom:2px solid var(--fg);vertical-align:bottom}
.best{color:var(--brand);font-weight:800}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.empty{padding:60px 0;text-align:center;color:var(--sub)}
.prose{max-width:720px}
.prose p{margin:0 0 12px;color:var(--sub);font-size:15px}
.prose h3{font-size:17px;font-weight:800;margin:26px 0 8px;color:var(--fg)}
.prose ul{margin:0 0 12px 18px;color:var(--sub);font-size:15px}
.prose li{margin-bottom:5px}
.note{background:var(--soft);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--sub);
  margin:14px 0}
.note b{color:var(--fg)}

footer{background:var(--soft);border-top:1px solid var(--line);padding:30px 0;margin-top:40px;
  font-size:13px;color:var(--sub);line-height:1.75}
footer b{color:var(--fg)}
@media(max-width:640px){
  .hero{padding:38px 0 22px}.hero h1{font-size:27px}
  nav a{padding:6px 9px;font-size:13px}
  .hd{gap:10px}.logo{font-size:16px}
  h2.tt{font-size:22px}
  .item{padding:12px 13px;gap:10px}
  .amt{margin-left:0;width:100%}
}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="logo" href="#/"><i></i>바꿔먹기</a>
  <nav>
    <a href="#/" data-r="home">검색</a>
    <a href="#/compare" data-r="compare">비교</a>
    <a href="#/about" data-r="about">데이터</a>
  </nav>
</div></header>

<main id="app"><div class="wrap"><div class="empty">데이터를 불러오는 중입니다…</div></div></main>

<footer><div class="wrap">
  <b>출처 : 농촌진흥청 국립농업과학원, 국가표준식품성분 DB 10.4</b><br>
  본 도구는 국가표준식품성분 DB를 활용해 제작한 비영리 웹 서비스입니다.
  데이터는 공공누리 제2유형(출처표시·상업적 이용금지)에 따라 이용하였습니다.<br>
  모든 수치는 <b>가식부 100g 기준</b>이며, 섭취량을 입력하면 해당 중량으로 환산해 보여 줍니다.
  값이 비어 있는 항목은 원본 DB에 측정값이 없는 경우입니다.
</div></footer>

<script>
var DB=null, IDX=[], sel=[];
var C_ENERGY=0, C_PROT=2, C_FAT=3, C_CARB=5, C_FIB=13, C_CA=16, C_FE=17, C_NA=21, C_SUGAR=6;
var SWAPS=[
 {k:'낮추기',items:[[21,'나트륨'],[6,'당류'],[85,'총 포화지방산'],[0,'에너지'],[3,'지방'],[82,'콜레스테롤']]},
 {k:'높이기',items:[[2,'단백질'],[13,'총 식이섬유'],[16,'칼슘'],[17,'철'],[45,'비타민 C'],[20,'칼륨']]}
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function fmt(v){ if(v===null||v===undefined) return '–';
  if(v===0) return '0';
  if(Math.abs(v)>=100) return v.toLocaleString('ko-KR',{maximumFractionDigits:0});
  if(Math.abs(v)>=10) return (+v).toFixed(1).replace(/\.0$/,'');
  return (+v).toFixed(2).replace(/0$/,'').replace(/\.$/,''); }
function val(f,ci){ return f[3+ci]; }
function scale(v,amt){ return v===null||v===undefined?null:v*amt/100; }

function load(){
  fetch('data.json').then(function(r){return r.json()}).then(function(d){
    DB=d;
    IDX=d.foods.map(function(f,i){return {i:i,n:f[1],g:d.groups[f[0]],s:f[1].replace(/[\s,·]/g,'')}});
    route();
  }).catch(function(){
    document.getElementById('app').innerHTML='<div class="wrap"><div class="empty">데이터를 불러오지 못했습니다.</div></div>';
  });
}

/* ---------- 검색 ---------- */
var q='', gfilter=null;
function search(){
  var qq=q.replace(/[\s,·]/g,'');
  var out=[];
  for(var i=0;i<IDX.length;i++){
    var it=IDX[i];
    if(gfilter!==null && DB.foods[it.i][0]!==gfilter) continue;
    if(qq && it.s.indexOf(qq)<0) continue;
    out.push(it.i);
    if(out.length>=300) break;
  }
  return out;
}
function viewHome(){
  var res=search();
  var chips=DB.groups.map(function(g,i){
    return '<button class="chip'+(gfilter===i?' on':'')+'" data-g="'+i+'">'+esc(g)+'</button>';}).join('');
  var listHtml = res.length ? res.map(function(id){
      var f=DB.foods[id];
      return '<button class="item" data-id="'+id+'"><div class="nm">'+esc(f[1])+
        '<span>'+esc(DB.groups[f[0]])+'</span></div>'+
        '<div class="kv"><b>'+fmt(val(f,C_ENERGY))+'</b>kcal / 100g</div>'+
        '<div class="kv">단백질 '+fmt(val(f,C_PROT))+'g<br>나트륨 '+fmt(val(f,C_NA))+'mg</div></button>';
    }).join('') : '<div class="empty">검색 결과가 없습니다.</div>';
  return '<div class="wrap">'+
    '<div class="hero"><h1>먹던 것 대신,<br>무엇을 먹을까</h1>'+
    '<p>국가표준식품성분 DB 10.4의 식품 '+DB.foods.length.toLocaleString('ko-KR')+'점을 검색하고, 성분 기준으로 대체 식품을 찾습니다.</p>'+
    '<div class="searchbox"><input id="q" type="search" placeholder="식품명 검색 (예: 고등어, 두부, 라면)" value="'+esc(q)+'"></div>'+
    '<div class="chips"><button class="chip'+(gfilter===null?' on':'')+'" data-g="-1">전체</button>'+chips+'</div></div>'+
    '<div class="sec"><div class="cnt">'+res.length+'건'+(res.length>=300?' (상위 300건)':'')+'</div>'+
    '<div class="list">'+listHtml+'</div></div></div>';
}

/* ---------- 식품 상세 ---------- */
var amt=100;
function viewFood(id){
  var f=DB.foods[id]; if(!f) return '<div class="wrap"><div class="empty">없는 식품입니다.</div></div>';
  var gs={},order=[];
  DB.cols.forEach(function(c,ci){
    if(!gs[c.g]){gs[c.g]=[];order.push(c.g);} gs[c.g].push(ci);
  });
  var body=order.map(function(g){
    var rows=gs[g].map(function(ci){
      var v=scale(val(f,ci),amt);
      var z=(v===null||v===0)?' zero':'';
      return '<div class="nr'+z+'"><span>'+esc(DB.cols[ci].n)+'</span><b>'+fmt(v)+
        (v===null?'':' '+esc(DB.cols[ci].u))+'</b></div>';
    }).join('');
    return '<div class="grp"><h3>'+esc(g)+'</h3>'+rows+'</div>';
  }).join('');
  var inSel=sel.indexOf(id)>=0;
  return '<div class="wrap">'+
   '<div class="crumb"><button data-back="1">← 검색으로</button></div>'+
   '<h2 class="tt">'+esc(f[1])+'</h2>'+
   '<div class="meta">'+esc(DB.groups[f[0]])+(f[2]?' · 출처 '+esc(f[2]):'')+'</div>'+
   '<div class="tools">'+
     '<button class="btn p" data-swap="'+id+'">바꿔먹기</button>'+
     '<button class="btn" data-sel="'+id+'">'+(inSel?'비교에서 빼기':'비교에 담기')+' ('+sel.length+')</button>'+
     '<div class="amt">섭취량 <input id="amt" type="number" min="1" max="2000" value="'+amt+'"> g</div>'+
   '</div>'+
   '<div class="note">아래 수치는 <b>'+amt+'g</b> 기준입니다. 원본 DB는 가식부 100g 기준으로 제공됩니다.</div>'+
   body+'<div style="height:40px"></div></div>';
}

/* ---------- 바꿔먹기 ---------- */
var swapCi=21, swapDir='down';
function viewSwap(id){
  var f=DB.foods[id]; if(!f) return '<div class="wrap"><div class="empty">없는 식품입니다.</div></div>';
  var base=val(f,swapCi);
  var e0=val(f,C_ENERGY);
  var cands=[];
  if(base!==null){
    for(var i=0;i<DB.foods.length;i++){
      if(i===id) continue;
      var g=DB.foods[i];
      if(g[0]!==f[0]) continue;                       // 같은 식품군 안에서만
      var v=val(g,swapCi); if(v===null) continue;
      var e=val(g,C_ENERGY);
      if(e0!==null && e!==null && e0>0 && Math.abs(e-e0)/e0>0.4) continue;  // 열량이 비슷한 것
      if(swapDir==='down' ? v<base : v>base) cands.push([i,v]);
    }
  }
  cands.sort(function(a,b){return swapDir==='down' ? a[1]-b[1] : b[1]-a[1];});
  cands=cands.slice(0,12);
  var opts=SWAPS.map(function(s){
    return '<optgroup label="'+s.k+'">'+s.items.map(function(it){
      var v=(s.k==='낮추기'?'down':'up')+':'+it[0];
      var on=(swapCi===it[0] && swapDir===(s.k==='낮추기'?'down':'up'))?' selected':'';
      return '<option value="'+v+'"'+on+'>'+esc(it[1])+' '+(s.k==='낮추기'?'낮추기':'높이기')+'</option>';
    }).join('')+'</optgroup>';
  }).join('');
  var rows = base===null
    ? '<div class="empty">이 식품에는 해당 성분 측정값이 없어 비교할 수 없습니다.</div>'
    : (cands.length ? cands.map(function(c){
        var g=DB.foods[c[0]];
        var d = base>0 ? Math.round((c[1]-base)/base*100) : null;
        var cls = swapDir==='down' ? 'd' : 'u';
        return '<button class="item" data-id="'+c[0]+'"><div class="nm">'+esc(g[1])+
          '<span>'+fmt(val(g,C_ENERGY))+'kcal / 100g</span></div>'+
          '<div class="kv"><b>'+fmt(c[1])+'</b>'+esc(DB.cols[swapCi].u)+'</div>'+
          '<div class="kv"><span class="delta '+cls+'">'+(d===null?'':(d>0?'+':'')+d+'%')+'</span></div></button>';
      }).join('') : '<div class="empty">조건에 맞는 대체 식품을 찾지 못했습니다.</div>');
  return '<div class="wrap">'+
   '<div class="crumb"><button data-food="'+id+'">← '+esc(f[1])+'</button></div>'+
   '<h2 class="tt">무엇으로 바꿀까</h2>'+
   '<div class="meta">'+esc(f[1])+' · '+esc(DB.groups[f[0]])+'</div>'+
   '<div class="swapbar"><select id="swapsel">'+opts+'</select>'+
   '<span style="font-size:14px;color:var(--sub)">기준 '+esc(DB.cols[swapCi].n)+' '+
   fmt(base)+esc(DB.cols[swapCi].u)+' · 같은 식품군 · 열량 ±40% 이내</span></div>'+
   '<div class="list">'+rows+'</div><div style="height:40px"></div></div>';
}

/* ---------- 비교 ---------- */
function viewCompare(){
  if(!sel.length) return '<div class="wrap"><div class="crumb"><button data-back="1">← 검색으로</button></div>'+
    '<h2 class="tt">비교</h2><div class="empty">식품 상세에서 “비교에 담기”를 눌러 최대 4개까지 담을 수 있습니다.</div></div>';
  var fs=sel.map(function(i){return DB.foods[i]});
  var gs={},order=[];
  DB.cols.forEach(function(c,ci){ if(!gs[c.g]){gs[c.g]=[];order.push(c.g);} gs[c.g].push(ci); });
  var head='<tr><th>성분</th>'+fs.map(function(f,k){
     return '<th>'+esc(f[1])+'<br><button class="btn" style="margin-top:6px;padding:4px 9px;font-size:12px" data-rm="'+sel[k]+'">빼기</button></th>';
   }).join('')+'</tr>';
  var body=order.map(function(g){
    var rows=gs[g].map(function(ci){
      var vals=fs.map(function(f){return val(f,ci)});
      if(vals.every(function(v){return v===null||v===0})) return '';
      var nums=vals.filter(function(v){return v!==null});
      var mx=Math.max.apply(null,nums);
      return '<tr><td>'+esc(DB.cols[ci].n)+' <span style="opacity:.6">'+esc(DB.cols[ci].u)+'</span></td>'+
        vals.map(function(v){return '<td'+(v!==null&&v===mx&&nums.length>1?' class="best"':'')+'>'+fmt(v)+'</td>'}).join('')+'</tr>';
    }).join('');
    if(!rows) return '';
    return '<tr><td colspan="'+(fs.length+1)+'" style="padding-top:20px"><b>'+esc(g)+'</b></td></tr>'+rows;
  }).join('');
  return '<div class="wrap"><div class="crumb"><button data-back="1">← 검색으로</button></div>'+
    '<h2 class="tt">비교</h2><div class="meta">가식부 100g 기준 · 초록색은 그 행에서 가장 높은 값</div>'+
    '<div class="scroll" style="margin-top:18px"><table class="cmp"><thead>'+head+'</thead><tbody>'+body+
    '</tbody></table></div><div style="height:40px"></div></div>';
}

/* ---------- 데이터 안내 ---------- */
function viewAbout(){
  return '<div class="wrap"><div class="crumb"><button data-back="1">← 검색으로</button></div>'+
  '<h2 class="tt">데이터</h2><div class="prose">'+
  '<div class="note"><b>출처</b> 농촌진흥청 국립농업과학원, 국가표준식품성분 DB 10.4<br>'+
  '<b>이용조건</b> 공공누리 제2유형 (출처표시 · 상업적 이용금지)</div>'+
  '<h3>무엇을 담고 있나</h3>'+
  '<p>국가표준식품성분 DB 10.4에 수록된 식품 '+DB.foods.length.toLocaleString('ko-KR')+'점, 성분 '+DB.cols.length+'항목을 그대로 담았습니다. '+
  '값을 가공하거나 추정하지 않았고, 원본에 측정값이 없는 항목은 빈칸으로 두었습니다.</p>'+
  '<h3>왜 만들었나</h3>'+
  '<p>국가표준식품성분 DB는 엑셀 파일 한 장으로 배포됩니다. 식품 '+DB.foods.length.toLocaleString('ko-KR')+'행에 성분이 가로로 '+DB.cols.length+'칸 늘어서 있어, '+
  '값 하나를 찾으려면 화면을 좌우로 끌어야 합니다. 두 식품을 나란히 비교하는 일은 사실상 불가능하고, 휴대폰에서는 열리지도 않습니다.</p>'+
  '<p>데이터가 부족한 것이 아니라 도구가 없었습니다. 이 웹 도구는 같은 데이터를 검색하고, 나란히 놓고, 바꿔 볼 수 있게 만든 것입니다.</p>'+
  '<h3>세 가지 기능</h3>'+
  '<ul><li><b>검색</b> — 식품명과 식품군으로 즉시 찾습니다.</li>'+
  '<li><b>바꿔먹기</b> — 나트륨·당류·포화지방을 낮추거나 단백질·식이섬유·칼슘을 높이는 방향으로, 같은 식품군 안에서 열량이 비슷한 대체 식품을 찾아 줍니다.</li>'+
  '<li><b>비교</b> — 최대 4개 식품의 '+DB.cols.length+'개 성분을 한 표에 나란히 놓습니다.</li></ul>'+
  '<h3>수치를 읽을 때</h3>'+
  '<ul><li>모든 값은 <b>가식부 100g</b> 기준입니다. 상세 화면에서 섭취량을 입력하면 그 중량으로 환산합니다.</li>'+
  '<li>바꿔먹기의 후보는 <b>같은 식품군</b>이면서 <b>열량 차이가 40% 이내</b>인 식품으로 한정했습니다. 실제 식단에서 자리를 바꿔 쓸 수 있는 범위로 좁힌 것입니다.</li>'+
  '<li>이 도구는 영양 상담이나 진단을 대신하지 않습니다.</li></ul>'+
  '</div><div style="height:40px"></div></div>';
}

/* ---------- 라우터 ---------- */
function route(){
  if(!DB) return;
  var h=location.hash.replace(/^#/,'')||'/';
  var app=document.getElementById('app'), html='', title='', cur='home';
  var m;
  if((m=h.match(/^\/food\/(\d+)$/))){ html=viewFood(+m[1]); title=DB.foods[+m[1]]?DB.foods[+m[1]][1]:'식품'; cur=''; }
  else if((m=h.match(/^\/swap\/(\d+)$/))){ html=viewSwap(+m[1]); title='바꿔먹기'; cur=''; }
  else if(h==='/compare'){ html=viewCompare(); title='비교'; cur='compare'; }
  else if(h==='/about'){ html=viewAbout(); title='데이터'; cur='about'; }
  else { html=viewHome(); title='검색'; cur='home'; }
  app.innerHTML=html;
  document.title=title+' · 바꿔먹기 — 국가표준식품성분 DB';
  document.querySelectorAll('nav a').forEach(function(a){
    if(a.dataset.r===cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo(0,0);
  var qi=document.getElementById('q');
  if(qi){ qi.addEventListener('input',function(){ q=this.value; var p=this.selectionStart;
      var v=viewHome(); document.getElementById('app').innerHTML=v;
      var n=document.getElementById('q'); n.value=q; n.focus(); n.setSelectionRange(p,p); bind(); }); }
  bind();
}
function bind(){
  var app=document.getElementById('app');
  app.onclick=function(e){
    var t=e.target.closest('[data-id],[data-g],[data-swap],[data-sel],[data-back],[data-food],[data-rm]');
    if(!t) return;
    if(t.dataset.id!==undefined){ location.hash='#/food/'+t.dataset.id; }
    else if(t.dataset.g!==undefined){ var g=+t.dataset.g; gfilter=(g<0?null:g);
      document.getElementById('app').innerHTML=viewHome(); bind(); }
    else if(t.dataset.swap!==undefined){ location.hash='#/swap/'+t.dataset.swap; }
    else if(t.dataset.food!==undefined){ location.hash='#/food/'+t.dataset.food; }
    else if(t.dataset.back!==undefined){ location.hash='#/'; }
    else if(t.dataset.rm!==undefined){ sel=sel.filter(function(x){return x!==+t.dataset.rm});
      document.getElementById('app').innerHTML=viewCompare(); bind(); }
    else if(t.dataset.sel!==undefined){ var id=+t.dataset.sel; var k=sel.indexOf(id);
      if(k>=0) sel.splice(k,1); else { if(sel.length>=4) sel.shift(); sel.push(id); }
      document.getElementById('app').innerHTML=viewFood(id); bind(); }
  };
  var a=document.getElementById('amt');
  if(a) a.addEventListener('change',function(){ amt=Math.max(1,Math.min(2000,+this.value||100));
    var id=+location.hash.split('/')[2]; document.getElementById('app').innerHTML=viewFood(id); bind(); });
  var s=document.getElementById('swapsel');
  if(s) s.addEventListener('change',function(){ var p=this.value.split(':');
    swapDir=p[0]; swapCi=+p[1];
    var id=+location.hash.split('/')[2]; document.getElementById('app').innerHTML=viewSwap(id); bind(); });
}
window.addEventListener('hashchange',route);
load();
</script>
